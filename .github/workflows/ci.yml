name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check tools/ mcp_server/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: |
          pip install -e ".[test]" 2>/dev/null || pip install pytest pydantic
      - name: Run unit tests (tool-level, no heavy deps)
        run: pytest tests/test_core.py tests/test_dispatch_pack.py tests/test_env_lock.py -v --tb=short
